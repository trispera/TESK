{{- if and (.Values.ingress.rules) (not .Values.oauth2.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-rules {{ if .Values.ingress.annotations }}
  annotations:
  {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }} {{ end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{ if .Values.ingress.tls_secret_name }}
  tls:
  - hosts:
    - {{ .Values.host_name }}
    secretName: {{ .Values.ingress.tls_secret_name }}
  {{ end }}
  rules:
  - host: {{ .Values.host_name }}
    http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: tesk-api
            port:
              number: {{ .Values.tesk.port }}
{{- end }}
{{- if and (.Values.ingress.rules) (.Values.oauth2.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-rules {{ if .Values.ingress.annotations }}
  annotations:
  {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }} {{ end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{ if .Values.ingress.tls_secret_name }}
  tls:
  - hosts:
    - {{ .Values.host_name }}
    secretName: {{ .Values.ingress.tls_secret_name }}
  {{ end }}
  rules:
  - host: {{ .Values.host_name }}
    http:
      paths:
      - path: {{ .Values.ingress.path }}
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
      - path: /token
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy-token
            port:
              number: 4181
{{- end }}
